# JANGAN SENTUH

services:

  student:
    build: ./student
    container_name: student-svc
    ports:
      - "8081:8081"
    networks:
      - micronet
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:8081/api/students/health" ]
      interval: 10s
      timeout: 5s
      retries: 3

  enrollment:
    build: ./enrollment
    container_name: enrollment-svc
    ports:
      - "8082:8082"
    environment:
      # Use Docker service name for inter-service calls
      USER_SERVICE_URL: http://student:8081
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:8082/api/enrollments/health" ]
      interval: 10s
      timeout: 5s
      retries: 3
    # depends_on:
    #   enrollment:
    #     condition: service_healthy
    networks:
      - micronet

  notification:
    build: ./notification
    container_name: notification-svc
    ports:
      - "8083:8083"
    environment:
      # Use Docker service name for inter-service calls
      USER_SERVICE_URL: http://student:8081
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:8083/api/notifications/health" ]
      interval: 10s
      timeout: 5s
      retries: 3
    # depends_on:
    #   notification:
    #     condition: service_healthy
    networks:
      - micronet

  booking:
    build: ./booking
    container_name: booking-svc
    ports:
      - "8084:8084"
    environment:
      # Use Docker service name for inter-service calls
      USER_SERVICE_URL: http://student:8081
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:8084/api/bookings/health" ]
      interval: 10s
      timeout: 5s
      retries: 3
    # depends_on:
    #   booking:
    #     condition: service_healthy
    networks:
      - micronet

  report:
    build: ./report
    container_name: report-svc
    ports:
      - "8085:8085"
    environment:
      # Use Docker service name for inter-service calls
      USER_SERVICE_URL: http://student:8081
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:8085/api/reports/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    # depends_on:
    #   report:
    #     condition: service_healthy
    networks:
      - micronet

  api-gateway:
    image: nginx:alpine
    container_name: gateway
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      student:
        condition: service_healthy
      enrollment:
        condition: service_healthy
      notification:
        condition: service_healthy
      booking:
        condition: service_healthy
      report:
        condition: service_healthy
    networks:
      - micronet

networks:
  micronet:
    driver: bridge
