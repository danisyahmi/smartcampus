server.port=8082
spring.application.name=enrollment

# rabbitmq configuration
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# database connection configuration
spring.datasource.url=jdbc:mysql://mysql-db:3306/enrollment_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update

# custom environment variable
external.student-service.url=${USER_SERVICE_URL:http://localhost:8081}