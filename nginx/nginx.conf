events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;

        # 1. Point Nginx to Docker's internal DNS resolver (Mandatory for dynamic variables)
        resolver 127.0.0.11 valid=5s;

        # 2. Route /api/students to student (Port 8081)
        location /api/students {
            set $student_profile_backend http://student:8081;
            proxy_pass $student_profile_backend;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 3. Route /api/enrollments to enrollment (Port 8082)
        location /api/enrollments {
            set $enrollment_backend http://enrollment:8082;
            proxy_pass $enrollment_backend;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 4. Route /api/notifications to notification (Port 8083)
        location /api/notifications {
            set $notification_backend http://notification:8083;
            proxy_pass $notification_backend;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 5. Route /api/orders to order (Port 8084)
        location /api/orders {
            set $order_backend http://order:8084;
            proxy_pass $order_backend;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 6. Route /api/reports to report (Port 8085)
        location /api/reports {
            set $report_backend http://report:8085;
            proxy_pass $report_backend;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Gateway health check
        location /health {
            add_header Content-Type application/json;
            return 200 '{"gateway":"UP"}';
        }
    }
}